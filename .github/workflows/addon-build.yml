name: Build & Push Add-on Images

on:
  push:
    branches: [main]
    paths:
      - "addons/cracked-oura/**"
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package*.json"
      - "frontend/vite.config.ts"
      - "frontend/index.html"
      - ".github/workflows/addon-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' addons/cracked-oura/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Copy source files into add-on build context
        run: |
          # Copies repo-root sources into addons/cracked-oura/ so the
          # Dockerfile's COPY instructions (relative to the build context)
          # can find frontend/ and backend/.
          rsync -a \
            --exclude='addons' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='dist-electron' \
            --exclude='.gitignore' \
            . addons/cracked-oura/
          # requirements.txt lives in backend/ but Dockerfile expects it at root
          cp backend/requirements.txt addons/cracked-oura/requirements.txt

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: addons/cracked-oura
          file: addons/cracked-oura/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-cracked-oura:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-cracked-oura:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
